<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- this the way of using css in the html as internal -->
     <!--h1 is selector here and what ever i write in the curly bracket is declaration -->
     <style>
        h1 {
            background-color: rgb(78, 173, 78) ;
            color:red;
        }
        div{
             background-color: rgb(241, 53, 1) ;
            color:rgb(103, 25, 229);
        }   
        p{
            background-color: rgb(199, 60, 150) ;
            color:rgb(239, 192, 3);
        }
     </style>
</head>
<body>
    <h1> hey ! this is Rohit </h1>
    <p>he is very good and want to be software engineer in the microsoft like company</p>
    <div>
        what do you think he will be or not ?
    </div>
</body>
</html>
