<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:flex;
            justify-content:space-around;
            border:2px solid black;
            padding:20px;
        }
        .box{
            width :150px;
            height :80px;
            background:tomato;
            color:white;
            margin:10px;
            text-align:center;
            line-height:80px;
            font-size:20px;
        }
    </style>
</head>
<body>
    <h2> Flexbox layout </h2>
    <div class="container">

    <div class="box">BOX 1</div>
    <div class="box">BOX 2</div>
    <div class="box">BOX 3</div>
    
    </div>
</body>
</html>
